[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ssam"
version = "0.2.0"
description = "Configuration-driven GD, SGD, and stochastic S-SAM experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.28.0",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.8", "scikit-learn>=1.4"]
benchmarks = ["torchvision>=0.17"]
dev = ["pytest>=8", "matplotlib>=3.8", "scikit-learn>=1.4", "torchvision>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
